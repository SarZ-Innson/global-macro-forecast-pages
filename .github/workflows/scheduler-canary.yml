name: Temporary Pages scheduler canary

on:
  schedule:
    # One-day diagnostic: 2026-09-30 17:23, 17:28, 17:33 Beijing time.
    - cron: '23,28,33 9 30 9 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record trigger
        run: |
          echo "event=${{ github.event_name }}"
          date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
